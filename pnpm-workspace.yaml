# Solo estos paquetes pueden ejecutar scripts de instalación (todo lo demás queda bloqueado).
allowBuilds:
  esbuild: true
  sharp: true
# Compatibilidad con pnpm 10
onlyBuiltDependencies:
  - esbuild
  - sharp
# Solo instala versiones publicadas hace más de 3 días (en minutos).
minimumReleaseAge: 4320
